name: Project site
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/site/**'
      - 'docs/screenshots/**'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [develop]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/site/**'
      - 'docs/screenshots/**'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build project site
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.npmrc
            /apps/*/package.json
            /packages/*/package.json
            /apps/site/**
            /docs/screenshots/**
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
          cache: pnpm
      - name: Install site dependencies
        run: pnpm --filter @hyper-chamber/site install --frozen-lockfile --ignore-scripts
      - name: Check and build static site
        run: |
          pnpm --filter @hyper-chamber/site typecheck
          pnpm --filter @hyper-chamber/site build
      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/build
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Publish project site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
