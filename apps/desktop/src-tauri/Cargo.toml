[package]
name = "hyper-chamber-desktop"
version = "1.0.0-beta.1"
description = "Hyper Chamber personal fighting-game reference"
authors = ["Squid Quarters"]
edition = "2021"
rust-version = "1.94"

[lib]
name = "hyper_chamber_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
dunce = "=1.0.5"
ureq = { version = "3.5", default-features = false, features = ["json"] }

[dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }
glob = "0.3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
